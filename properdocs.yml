# Site information
site_name: MIT - The Missing Semester of Your CS Education 2026
site_url: https://justarium.github.io/mit-missing-semester/
site_description: The Missing Semester of Your CS Education
copyright: A backup of <a href="https://missing.csail.mit.edu/">MIT | The Missing Semester of Your CS Education</a>
repo_url: https://github.com/justarium/mit-missing-semester

theme:
  name: materialx
  favicon: assets/favicon.ico
  language: "zh"
  icon:
    logo: material/island
    repo: fontawesome/brands/github-alt
  font:
    text: Open Sans, Helvetica Neue, Roboto, sans-serif, serif
    code: Fira Mono, Fira Code, Roboto Mono, monospace
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.footer
    - navigation.indexes
    # - navigation.instant
    # - navigation.instant.progress
    - navigation.path
    - navigation.prune
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy

markdown_extensions:
  - abbr
  - attr_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      auto_title: true
      line_spans: __span
      linenums_style: pymdownx-inline
      linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - nl2br
  - admonition
  - pymdownx.details

extra_javascript:
  - static/js/katex.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/contrib/auto-render.min.js

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/katex.min.css

plugins:
  - search
  - callouts:
      aliases: true
  - i18n:
      docs_structure: folder # suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: 计算机教育中缺失的一课（2026版）
          nav_translations:
            Home: 课程首页
            Lectures: 讲座列表
            2026 Lectures: 2026年讲座
            2020 Lectures: 2020年讲座
            2019 Lectures: 2019年讲座
            Archives: 往年课程
            About: 关于本课程
            Solutions: 习题解答
            2020 Solutions: 2020年习题解答
            Introduction: 课程概要
            License: 许可证
            Past: 往期课程
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                primary: deep orange
                scheme: default
              - media: "(prefers-color-scheme: dark)"
                primary: black
                scheme: slate

